<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <!-- Tiny feet -->
  <ellipse cx="105" cy="275" rx="22" ry="12" fill="#8888AA"/>
  <ellipse cx="195" cy="275" rx="22" ry="12" fill="#8888AA"/>

  <!-- Body -->
  <circle cx="150" cy="150" r="110" fill="#8888AA"/>

  <!-- Inner glow -->
  <circle cx="128" cy="122" r="60" fill="rgba(255,255,255,0.12)"/>

  <!-- Eyes - whites -->
  <circle cx="119" cy="140" r="18" fill="#FFF"/>
  <circle cx="181" cy="140" r="18" fill="#FFF"/>

  <!-- Eyes - pupils -->
  <circle cx="119" cy="142" r="15" fill="#1a1a2e"/>
  <circle cx="181" cy="142" r="15" fill="#1a1a2e"/>

  <!-- Eyes - big highlight -->
  <circle cx="124" cy="138" r="7" fill="#FFF"/>
  <circle cx="186" cy="138" r="7" fill="#FFF"/>

  <!-- Eyes - small highlight -->
  <circle cx="115" cy="146" r="3" fill="#FFF"/>
  <circle cx="177" cy="146" r="3" fill="#FFF"/>

  <!-- Blush -->
  <ellipse cx="96" cy="156" rx="14" ry="9" fill="rgba(200,160,220,0.4)"/>
  <ellipse cx="204" cy="156" rx="14" ry="9" fill="rgba(200,160,220,0.4)"/>

  <!-- Wobbly mouth ~ -->
  <path d="M128,180 Q139,173 150,180 Q161,187 172,180" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>

  <!-- Sweat drop -->
  <path d="M210,58 Q220,95 210,100 Q200,95 210,58Z" fill="#88CCEE"/>

  <!-- Question marks -->
  <text x="84" y="50" font-family="Noto Sans TC, sans-serif" font-weight="bold" font-size="50" fill="rgba(255,255,255,0.6)" text-anchor="middle">?</text>
  <text x="117" y="18" font-family="Noto Sans TC, sans-serif" font-weight="bold" font-size="33" fill="rgba(255,255,255,0.35)" text-anchor="middle">?</text>
</svg>
