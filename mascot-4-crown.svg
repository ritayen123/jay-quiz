  <circle cx="174" cy="196" r="5" fill="#FFF"/>

  <!-- Eyes - small highlight -->
  <circle cx="127" cy="202" r="2.2" fill="#FFF"/>
  <circle cx="167" cy="202" r="2.2" fill="#FFF"/>

  <!-- Blush -->
