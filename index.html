<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>周杰倫粉絲大調查 | 韭點開始</title>
  <meta name="description" content="你是真杰迷還是路人甲？13 題趣味測驗，空耳歌詞、奶茶冷知識、NFT 事件通通考！由韭點開始製作。" />
  <meta property="og:title" content="周杰倫粉絲大調查 | 韭點開始" />
  <meta property="og:description" content="你是真杰迷還是路人甲？13 題趣味測驗立刻挑戰！" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal: #84D2DD;
      --lime: #AAF952;
      --green: #01A94D;
      --pink: #F1B9E1;
      --black: #0A0A0A;
      --white: #FFFFFF;
      --correct: #01A94D;
      --wrong: #E74C3C;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 3px; }

    /* ========= BACKGROUND ========= */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(170,249,82,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(170,249,82,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    .bg-glow {
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(132,210,221,0.12) 0%, transparent 70%);
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    .pixel-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      will-change: transform;
    }
    .pixel-block {
      position: absolute;
      background: var(--lime);
      opacity: 0.05;
      animation: floatBlock linear infinite;
    }
    @keyframes floatBlock {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.05; }
      90% { opacity: 0.05; }
      100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
    }

    /* ========= LAYOUT ========= */
    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ========= SCREENS ========= */
    .screen { display: none; width: 100%; text-align: center; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ========= START SCREEN ========= */
    .start-icon {
      margin-bottom: 24px;
      animation: bounce 2s ease-in-out infinite;
      color: var(--lime);
    }
    .start-icon svg {
      width: 72px;
      height: 72px;
      stroke-width: 1.5;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    .start-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(16px, 4vw, 28px);
      line-height: 2;
      color: var(--white);
      margin-bottom: 12px;
    }
    .start-title .accent { color: var(--lime); }
    .start-title .accent-teal { color: var(--teal); }

    .start-desc {
      font-size: clamp(14px, 2.5vw, 17px);
      color: rgba(255,255,255,0.6);
      line-height: 1.8;
      max-width: 480px;
      margin-bottom: 40px;
    }

    .start-stats {
      display: flex;
      gap: 32px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .start-stat {
      text-align: center;
    }
    .start-stat-num {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 3vw, 26px);
      color: var(--lime);
      display: block;
      margin-bottom: 4px;
    }
    .start-stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--lime);
      color: var(--black);
      border: none;
      padding: 16px 48px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 18px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.1em;
    }
    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(170,249,82,0.4);
    }
    .btn-start:active {
      transform: translateY(-1px);
      box-shadow: 0 2px 12px rgba(170,249,82,0.3);
    }

    .brand-tag {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(170,249,82,0.08);
      border: 1px solid rgba(170,249,82,0.2);
      border-radius: 2px;
      padding: 6px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
    }
    .brand-tag a {
      color: var(--lime);
      text-decoration: none;
    }
    .brand-tag a:hover { text-decoration: underline; }

    /* ========= QUIZ SCREEN ========= */
    .progress-bar-wrap {
      width: 100%;
      max-width: 580px;
      margin-bottom: 32px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    .progress-info .current {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--lime);
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--lime);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .question-card {
      width: 100%;
      max-width: 580px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 32px 28px;
    }

    .question-number {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--teal);
      margin-bottom: 16px;
      letter-spacing: 0.1em;
    }

    .question-text {
      font-size: clamp(16px, 2.5vw, 20px);
      font-weight: 700;
      line-height: 1.7;
      margin-bottom: 28px;
      color: var(--white);
      text-align: left;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      padding: 14px 18px;
      color: var(--white);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      line-height: 1.5;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .option-btn:hover:not(.disabled) {
      background: rgba(170,249,82,0.08);
      border-color: rgba(170,249,82,0.3);
    }
    .option-btn:active:not(.disabled) {
      background: rgba(170,249,82,0.15);
      border-color: rgba(170,249,82,0.5);
    }
    .option-btn .option-letter {
      flex-shrink: 0;
      width: 28px; height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      transition: all 0.2s;
    }
    .option-btn:hover:not(.disabled) .option-letter {
      background: rgba(170,249,82,0.15);
      color: var(--lime);
    }

    /* ========= IMAGE QUESTION ========= */
    .options.image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .option-img-btn {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
      aspect-ratio: 1;
    }
    .option-img-btn:hover:not(.disabled) {
      border-color: rgba(170,249,82,0.5);
      transform: scale(1.02);
    }
    .option-img-btn:active:not(.disabled) {
      border-color: var(--lime);
      transform: scale(0.98);
    }
    .option-img-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .option-img-btn .img-letter {
      position: absolute;
      top: 8px; left: 8px;
      width: 28px; height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      border-radius: 2px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--white);
      z-index: 2;
    }
    .option-img-btn .img-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      text-align: center;
    }
    .option-img-btn.correct {
      border-color: var(--correct);
      box-shadow: 0 0 16px rgba(1,169,77,0.4);
    }
    .option-img-btn.correct .img-letter {
      background: var(--correct);
    }
    .option-img-btn.wrong {
      border-color: var(--wrong);
      box-shadow: 0 0 16px rgba(231,76,60,0.3);
    }
    .option-img-btn.wrong .img-letter {
      background: var(--wrong);
    }
    .option-img-btn.disabled {
      cursor: default;
      opacity: 0.45;
    }
    .option-img-btn.correct.disabled { opacity: 1; }

    @media (max-width: 600px) {
      .options.image-grid { gap: 8px; }
    }

    .option-btn.correct {
      background: rgba(1,169,77,0.15);
      border-color: var(--correct);
    }
    .option-btn.correct .option-letter {
      background: var(--correct);
      color: var(--white);
    }
    .option-btn.wrong {
      background: rgba(231,76,60,0.12);
      border-color: var(--wrong);
    }
    .option-btn.wrong .option-letter {
      background: var(--wrong);
      color: var(--white);
    }
    .option-btn.disabled {
      cursor: default;
      opacity: 0.5;
    }
    .option-btn.correct.disabled { opacity: 1; }

    .explanation {
      display: none;
      margin-top: 20px;
      padding: 16px 18px;
      background: rgba(132,210,221,0.08);
      border-left: 3px solid var(--teal);
      border-radius: 0 3px 3px 0;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.75);
      text-align: left;
    }
    .explanation.show { display: block; }

    /* Fill-in question */
    .fill-wrap {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .fill-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 3px;
      padding: 14px 18px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 18px;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s;
    }
    .fill-input:focus {
      border-color: var(--lime);
      box-shadow: 0 0 0 3px rgba(170,249,82,0.15);
    }
    .fill-input::placeholder {
      color: rgba(255,255,255,0.25);
    }
    .fill-input.correct {
      border-color: var(--correct);
      background: rgba(1,169,77,0.1);
    }
    .fill-input.wrong {
      border-color: var(--wrong);
      background: rgba(231,76,60,0.08);
    }
    .fill-input:disabled {
      opacity: 0.7;
    }
    .btn-submit {
      background: var(--lime);
      color: var(--black);
      border: none;
      padding: 14px 24px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(170,249,82,0.4);
    }
    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(170,249,82,0.3);
    }
    .btn-submit:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      box-shadow: none;
    }
    .fill-answer-reveal {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 700;
    }
    .fill-answer-reveal.correct { color: var(--correct); }
    .fill-answer-reveal.wrong { color: var(--wrong); }

    .btn-next {
      display: none;
      margin-top: 24px;
      background: var(--lime);
      color: var(--black);
      border: none;
      padding: 12px 36px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-next.show { display: inline-flex; }
    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(170,249,82,0.4);
    }
    .btn-next:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(170,249,82,0.3);
    }

    /* ========= RESULT SCREEN ========= */
    .share-preview-wrap {
      width: 100%;
      max-width: 360px;
      margin-bottom: 16px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .share-preview-wrap img {
      width: 100%;
      display: block;
    }
    .share-hint {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 24px;
    }


    .result-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--pink);
      color: var(--black);
      border: none;
      padding: 12px 28px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-share:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(241,185,225,0.4);
    }
    .btn-share:active {
      transform: translateY(0);
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 28px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 500;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-retry:hover {
      border-color: var(--lime);
      color: var(--lime);
    }

    .btn-ig {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--lime);
      color: var(--black);
      text-decoration: none;
      padding: 12px 28px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 2px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-ig:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(170,249,82,0.4);
    }
    .btn-ig:active {
      transform: translateY(0);
    }

    .result-brand {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    .result-brand a {
      color: var(--lime);
      text-decoration: none;
    }
    .result-brand a:hover { text-decoration: underline; }

    /* ========= TEST PANEL ========= */
    .test-panel {
      margin-top: 40px;
      padding: 20px;
      border: 1px dashed rgba(241,185,225,0.3);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 380px;
    }
    .test-label {
      font-size: 12px;
      color: var(--pink);
      text-align: center;
      margin-bottom: 4px;
    }
    .test-btn {
      background: rgba(241,185,225,0.1);
      border: 1px solid rgba(241,185,225,0.25);
      color: var(--white);
      padding: 12px 16px;
      border-radius: 3px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      touch-action: manipulation;
    }
    .test-btn:hover {
      background: rgba(241,185,225,0.2);
      border-color: var(--pink);
    }
    .test-btn:active {
      background: rgba(241,185,225,0.3);
    }

    /* ========= TOAST ========= */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--lime);
      color: var(--black);
      padding: 12px 24px;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ========= RESPONSIVE ========= */
    @media (max-width: 600px) {
      .container { padding: 16px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
      .question-card { padding: 24px 18px; }
      .option-btn { padding: 12px 14px; font-size: 14px; }
      .result-score-box { padding: 16px 20px; }
      .result-buttons { flex-direction: column; align-items: center; }
      .start-stats { gap: 20px; }
    }

    @media (max-width: 380px) {
      .container { padding: 12px; }
      .question-card { padding: 18px 14px; }
      .option-btn { padding: 10px 12px; font-size: 13px; gap: 10px; }
      .btn-start { padding: 14px 36px; font-size: 16px; }
      .fill-input { font-size: 16px; padding: 12px 14px; }
      .btn-submit { padding: 12px 18px; font-size: 15px; }
      .share-preview-wrap { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="pixel-bg" id="pixelBg"></div>

  <div class="container">

    <!-- ===== START SCREEN ===== -->
    <div class="screen active" id="startScreen">
      <div class="start-icon"><i data-lucide="mic" ></i></div>
      <h1 class="start-title">
        <span class="accent">周杰倫</span><br>
        <span class="accent-teal">粉絲大調查</span>
      </h1>
      <p class="start-desc">
        空耳歌詞、奶茶冷知識、NFT 被盜事件、比特幣風波⋯⋯<br>
        23 道題目，測測你是真杰迷還是路人甲！
      </p>
      <button class="btn-start" onclick="startQuiz()">開始測驗 <i data-lucide="arrow-right" style="width:20px;height:20px"></i></button>
      <div class="brand-tag">
        Made by <a href="https://www.instagram.com/from_nine_on" target="_blank" rel="noopener">@韭點開始</a>
      </div>
      <!-- TEST: Preview all 5 result levels -->

    function shuffleQuestions() {
      questions.forEach(q => {
        if (q.noShuffle || q.type === 'fill') return;
        const correctText = q.type === 'image' ? q.options[q.answer].img : q.options[q.answer];
        for (let i = q.options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
        }
        q.answer = q.options.findIndex(o => q.type === 'image' ? o.img === correctText : o === correctText);
      });
    }

      score = 0;
      shuffleQuestions();
      showScreen('quizScreen');

    function renderQuestion() {
      answered = false;
      const q = questions[currentQ];
      const letters = ['A', 'B', 'C', 'D'];

      document.getElementById('progressText').textContent = `Q${currentQ + 1} / ${questions.length}`;
      document.getElementById('scoreText').textContent = `答對 ${score} 題`;
      document.getElementById('progressFill').style.width = ((currentQ) / questions.length * 100) + '%';
      document.getElementById('questionNumber').textContent = `QUESTION ${String(currentQ + 1).padStart(2, '0')}`;
      document.getElementById('questionText').textContent = q.q;

      const wrap = document.getElementById('optionsWrap');
      wrap.innerHTML = '';

      if (q.type === 'fill') {
        wrap.className = 'options';
        wrap.innerHTML = `
          <div class="fill-wrap">
            <input type="text" class="fill-input" id="fillInput" placeholder="輸入答案（${q.answer.length}個字）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="${q.answer.length + 5}" />
            <button class="btn-submit" id="btnFillSubmit" onclick="submitFill()">送出</button>
          </div>
          <div class="fill-answer-reveal" id="fillReveal"></div>
        `;
        const input = document.getElementById('fillInput');
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(); });
        input.focus();
      } else if (q.type === 'image') {
        wrap.className = 'options image-grid';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('div');
          btn.className = 'option-img-btn';
          btn.innerHTML = `<span class="img-letter">${letters[i]}</span><img src="${opt.img}" alt="選項 ${letters[i]}" onerror="this.style.display='none';this.parentElement.style.background='rgba(255,255,255,0.06)';this.insertAdjacentHTML('afterend','<span style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;\\'>🤔</span>')"><span class="img-label">${opt.label}</span>`;
          btn.onclick = () => selectAnswer(i);
          wrap.appendChild(btn);
        });
      } else {
        wrap.className = 'options';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
          btn.onclick = () => selectAnswer(i);
          wrap.appendChild(btn);
        });
      }

      document.getElementById('explanation').className = 'explanation';
      document.getElementById('explanation').textContent = '';
      document.getElementById('btnNext').className = 'btn-next';
    }

    function submitFill() {
      if (answered) return;
      const input = document.getElementById('fillInput');
      const userAns = input.value.trim();
      if (!userAns) return;
      answered = true;

      const q = questions[currentQ];
      const correct = userAns === q.answer;
      if (correct) score++;

      input.disabled = true;
      input.classList.add(correct ? 'correct' : 'wrong');
      document.getElementById('btnFillSubmit').disabled = true;

      const reveal = document.getElementById('fillReveal');
      reveal.className = 'fill-answer-reveal ' + (correct ? 'correct' : 'wrong');
      reveal.textContent = correct ? '✅ 答對了！' : `❌ 正確答案：${q.answer}`;

      document.getElementById('scoreText').textContent = `答對 ${score} 題`;

      const exp = document.getElementById('explanation');
      exp.textContent = (correct ? '✅ 答對了！' : '❌ 答錯了！') + ' ' + q.explain;
      exp.className = 'explanation show';

      const btnNext = document.getElementById('btnNext');
      btnNext.textContent = currentQ < questions.length - 1 ? '下一題 →' : '看結果';
      btnNext.className = 'btn-next show';
    }

    function selectAnswer(idx) {
      if (answered) return;
      answered = true;

      const q = questions[currentQ];
      const isImage = q.type === 'image';
      const btnClass = isImage ? '.option-img-btn' : '.option-btn';
      const btns = document.querySelectorAll(btnClass);

      btns.forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === q.answer) btn.classList.add('correct');
        if (i === idx && idx !== q.answer) btn.classList.add('wrong');
      });

      if (idx === q.answer) score++;

      document.getElementById('scoreText').textContent = `答對 ${score} 題`;

      const exp = document.getElementById('explanation');
      exp.textContent = (idx === q.answer ? '✅ 答對了！' : '❌ 答錯了！') + ' ' + q.explain;
      exp.className = 'explanation show';

      const btnNext = document.getElementById('btnNext');
      btnNext.textContent = currentQ < questions.length - 1 ? '下一題 →' : '看結果';
      btnNext.className = 'btn-next show';
    }

    // ===== KAWAII HELPER =====
    function drawKawaiiEyes(ctx, cx, cy, size, eyeSpacing) {
      const sp = eyeSpacing || 0.28;
      const eyeR = size * 0.14;
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(cx - size*sp, cy, eyeR * 1.15, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*sp, cy, eyeR * 1.15, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(cx - size*sp, cy + eyeR*0.1, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*sp, cy + eyeR*0.1, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(cx - size*sp + eyeR*0.35, cy - eyeR*0.25, eyeR*0.45, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*sp + eyeR*0.35, cy - eyeR*0.25, eyeR*0.45, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - size*sp - eyeR*0.25, cy + eyeR*0.25, eyeR*0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*sp - eyeR*0.25, cy + eyeR*0.25, eyeR*0.2, 0, Math.PI*2); ctx.fill();
    }
    function drawKawaiiBlush(ctx, cx, cy, size, color) {
      ctx.fillStyle = color || 'rgba(255,150,150,0.35)';
      ctx.beginPath(); ctx.ellipse(cx - size*0.42, cy + size*0.12, size*0.12, size*0.08, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + size*0.42, cy + size*0.12, size*0.12, size*0.08, 0, 0, Math.PI*2); ctx.fill();
    }
    function drawKawaiiSmile(ctx, cx, cy, size) {
      ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = size*0.045; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.18, size*0.13, 0.15, Math.PI - 0.15); ctx.stroke();
    }

    // ===== MASCOT DRAWING FUNCTIONS (KAWAII) =====
    function drawMascotConfused(ctx, cx, cy, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy, size, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(cx - size*0.2, cy - size*0.25, size*0.55, 0, Math.PI*2); ctx.fill();
      drawKawaiiEyes(ctx, cx, cy - size*0.08, size);
      drawKawaiiBlush(ctx, cx, cy - size*0.08, size, 'rgba(200,160,220,0.35)');
      ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = size*0.05; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - size*0.18, cy + size*0.28);
      ctx.quadraticCurveTo(cx - size*0.06, cy + size*0.22, cx, cy + size*0.28);
      ctx.quadraticCurveTo(cx + size*0.06, cy + size*0.34, cx + size*0.18, cy + size*0.28);
      ctx.stroke();
      ctx.fillStyle = '#88CCEE';
      ctx.beginPath();
      ctx.moveTo(cx + size*0.55, cy - size*0.65);
      ctx.quadraticCurveTo(cx + size*0.65, cy - size*0.35, cx + size*0.55, cy - size*0.3);
      ctx.quadraticCurveTo(cx + size*0.45, cy - size*0.35, cx + size*0.55, cy - size*0.65);
      ctx.fill();
      ctx.font = `bold ${size*0.45}px "Noto Sans TC", sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', cx - size*0.6, cy - size*0.9);
      ctx.font = `bold ${size*0.3}px "Noto Sans TC", sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('?', cx - size*0.3, cy - size*1.15);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.ellipse(cx - size*0.3, cy + size*1.05, size*0.18, size*0.1, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + size*0.3, cy + size*1.05, size*0.18, size*0.1, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawMascotMic(ctx, cx, cy, size, color) {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.roundRect(cx - size*0.12, cy + size*0.35, size*0.24, size*0.65, size*0.1); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = size*0.04;
      ctx.beginPath(); ctx.roundRect(cx - size*0.12, cy + size*0.35, size*0.24, size*0.65, size*0.1); ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy - size*0.1, size*0.65, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(cx - size*0.15, cy - size*0.3, size*0.35, 0, Math.PI*2); ctx.fill();
      drawKawaiiEyes(ctx, cx, cy - size*0.15, size*0.7);
      drawKawaiiBlush(ctx, cx, cy - size*0.15, size*0.7, 'rgba(255,180,200,0.4)');
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.12, size*0.15, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#FF8899';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.2, size*0.08, 0, Math.PI); ctx.fill();
      ctx.font = `${size*0.3}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\u266A', cx + size*0.7, cy - size*0.55);
      ctx.font = `${size*0.22}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('\u266B', cx + size*0.9, cy - size*0.25);
      ctx.fillStyle = '#FFF'; ctx.font = `${size*0.2}px sans-serif`;
      ctx.fillText('\u2728', cx - size*0.75, cy - size*0.5);
    }

    function drawMascotBubbleTea(ctx, cx, cy, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx - size*0.5, cy - size*0.4);
      ctx.quadraticCurveTo(cx - size*0.45, cy + size*0.85, cx - size*0.32, cy + size*0.9);
      ctx.lineTo(cx + size*0.32, cy + size*0.9);
      ctx.quadraticCurveTo(cx + size*0.45, cy + size*0.85, cx + size*0.5, cy - size*0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.moveTo(cx - size*0.35, cy - size*0.35);
      ctx.quadraticCurveTo(cx - size*0.3, cy + size*0.4, cx - size*0.2, cy + size*0.5);
      ctx.lineTo(cx - size*0.05, cy + size*0.5);
      ctx.quadraticCurveTo(cx - size*0.05, cy - size*0.2, cx - size*0.1, cy - size*0.35);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(cx, cy - size*0.4, size*0.52, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.roundRect(cx - size*0.55, cy - size*0.48, size*1.1, size*0.16, 4); ctx.fill();
      ctx.strokeStyle = '#FF6B8A'; ctx.lineWidth = size*0.1; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx + size*0.1, cy + size*0.1);
      ctx.lineTo(cx + size*0.1, cy - size*0.55);
      ctx.quadraticCurveTo(cx + size*0.1, cy - size*0.75, cx + size*0.25, cy - size*0.8);
      ctx.stroke();
      ctx.fillStyle = '#2D1810';
      const bobas = [[-0.18,0.55],[0.0,0.65],[0.2,0.55],[-0.1,0.78],[0.12,0.75],[0.28,0.68],[-0.25,0.7]];
      bobas.forEach(([bx,by]) => {
        ctx.beginPath(); ctx.arc(cx+size*bx, cy+size*by, size*0.08, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.arc(cx+size*bx+size*0.02, cy+size*by-size*0.03, size*0.03, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2D1810';
      });
      drawKawaiiEyes(ctx, cx, cy + size*0.1, size*0.65);
      drawKawaiiBlush(ctx, cx, cy + size*0.1, size*0.65, 'rgba(255,150,150,0.35)');
      drawKawaiiSmile(ctx, cx, cy + size*0.1, size*0.65);
      ctx.font = `${size*0.25}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\u2764', cx + size*0.55, cy - size*0.65);
    }

    function drawMascotCrown(ctx, cx, cy, size, color) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.35, size*0.6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(cx - size*0.75, cy + size*0.15);
      ctx.lineTo(cx - size*0.75, cy - size*0.2);
      ctx.quadraticCurveTo(cx - size*0.55, cy - size*0.05, cx - size*0.38, cy - size*0.25);
      ctx.quadraticCurveTo(cx - size*0.2, cy + size*0.05, cx, cy - size*0.6);
      ctx.quadraticCurveTo(cx + size*0.2, cy + size*0.05, cx + size*0.38, cy - size*0.25);
      ctx.quadraticCurveTo(cx + size*0.55, cy - size*0.05, cx + size*0.75, cy - size*0.2);
      ctx.lineTo(cx + size*0.75, cy + size*0.15);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(cx - size*0.78, cy + size*0.08, size*1.56, size*0.18, 4); ctx.fill();
      ctx.fillStyle = '#FF4466'; ctx.beginPath(); ctx.arc(cx, cy - size*0.2, size*0.1, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(cx + size*0.03, cy - size*0.23, size*0.035, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#66BBFF'; ctx.beginPath(); ctx.arc(cx - size*0.38, cy + size*0.02, size*0.07, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*0.38, cy + size*0.02, size*0.07, 0, Math.PI*2); ctx.fill();
      drawKawaiiEyes(ctx, cx, cy + size*0.38, size*0.65);
      drawKawaiiBlush(ctx, cx, cy + size*0.38, size*0.65, 'rgba(255,200,100,0.35)');
      ctx.font = `${size*0.18}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\u2728', cx + size*0.7, cy - size*0.45);
      ctx.fillText('\u2728', cx - size*0.65, cy - size*0.5);
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.58, size*0.1, 0, Math.PI); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.ellipse(cx - size*0.25, cy + size*0.92, size*0.15, size*0.08, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + size*0.25, cy + size*0.92, size*0.15, size*0.08, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawMascotTrophy(ctx, cx, cy, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(cx - size*0.1, cy + size*0.35, size*0.2, size*0.35, 4); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx - size*0.38, cy + size*0.65, size*0.76, size*0.14, 8); ctx.fill();

      ctx.beginPath(); ctx.arc(cx, cy - size*0.05, size*0.58, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.arc(cx - size*0.15, cy - size*0.2, size*0.3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx - size*0.72, cy - size*0.05, size*0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*0.72, cy - size*0.05, size*0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(cx - size*0.72, cy - size*0.05, size*0.12, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + size*0.72, cy - size*0.05, size*0.12, 0, Math.PI*2); ctx.fill();
      drawKawaiiEyes(ctx, cx, cy - size*0.08, size*0.6);
      drawKawaiiBlush(ctx, cx, cy - size*0.08, size*0.6, 'rgba(170,255,100,0.3)');

      ctx.beginPath(); ctx.arc(cx, cy + size*0.15, size*0.16, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#FF8899';
      ctx.beginPath(); ctx.arc(cx, cy + size*0.22, size*0.08, 0, Math.PI); ctx.fill();
      ctx.font = `${size*0.32}px sans-serif`; ctx.fillStyle = '#FFF';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.fillText('\u2728', cx + size*0.7, cy - size*0.5);
      ctx.fillText('\u2728', cx + size*0.5, cy + size*0.55);
    }

    // ===== SHARE AS IMAGE (IG Story 1080x1920) =====
    function generateShareImage() {
      const r = results.find(r => score >= r.min && score <= r.max);
      const pd = getPosterData(score);
      const canvas = document.getElementById('shareCanvas');
      const ctx = canvas.getContext('2d');
      const W = 1080, H = 1920;
      canvas.width = W;
      canvas.height = H;
      const PAD = 56;

      // --- Background ---
      ctx.fillStyle = pd.bg;
      ctx.fillRect(0, 0, W, H);

      // --- Decorative scattered elements ---
      function drawStar(x, y, r, color) {
        ctx.fillStyle = color; ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i * 4 * Math.PI / 5) - Math.PI / 2;
          const method = i === 0 ? 'moveTo' : 'lineTo';
          ctx[method](x + r * Math.cos(a), y + r * Math.sin(a));
        }
        ctx.closePath(); ctx.fill();
      }
      function drawSmiley(x, y, size, color) {
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = pd.bg; ctx.beginPath(); ctx.arc(x-size*0.3, y-size*0.15, size*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x+size*0.3, y-size*0.15, size*0.15, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = pd.bg; ctx.lineWidth = size*0.12; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(x, y+size*0.1, size*0.3, 0.2, Math.PI-0.2); ctx.stroke();
      }
      // Top-left corner elements
      drawStar(120, 200, 20, pd.accent);
      drawStar(80, 350, 12, 'rgba(255,255,255,0.15)');
      drawSmiley(950, 280, 32, pd.accent);
      drawStar(980, 420, 16, 'rgba(255,255,255,0.2)');
      // Scattered dots
      [140,320,500,700,900,1100,1350,1500].forEach((dy,i) => {
        const dx = (i % 2 === 0) ? 60 + Math.random()*80 : W - 60 - Math.random()*80;
        ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.arc(dx, dy, 4 + Math.random()*4, 0, Math.PI*2); ctx.fill();
      });

      // --- Top info bar ---
      ctx.font = '500 24px "Noto Sans TC", sans-serif'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.textAlign = 'left';
      ctx.fillText('2026', PAD, PAD);
      ctx.fillText('#周杰倫粉絲', PAD, PAD + 34);
      ctx.fillText('#大調查', PAD, PAD + 68);
      ctx.textAlign = 'right';
      ctx.fillText('#JayChou', W - PAD, PAD);
      ctx.fillText(`Score ${score}/${questions.length}`, W - PAD, PAD + 34);

      // --- Big vertical side text (right) ---
      ctx.save();
      ctx.translate(W - 20, H * 0.72);
      ctx.rotate(-Math.PI / 2);
      ctx.font = '900 260px "Noto Sans TC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pd.bigWord, 0, 0);
      ctx.restore();

      // --- Big English word at top ---
      ctx.font = '900 100px "Noto Sans TC", sans-serif';
      ctx.fillStyle = pd.accent;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(pd.bigWord, W/2, 160);

      // --- Left vertical text ---
      ctx.save();
      ctx.translate(28, H * 0.45);
      ctx.rotate(-Math.PI / 2);
      ctx.font = '900 140px "Noto Sans TC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('周杰倫粉絲大調查', 0, 0);
      ctx.restore();

      // --- Center frame with mascot ---
      const frameX = (W - 560) / 2, frameY = 320, frameW = 560, frameH = 520;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.roundRect(frameX, frameY, frameW, frameH, 24); ctx.fill();
      ctx.strokeStyle = pd.accent; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(frameX, frameY, frameW, frameH, 24); ctx.stroke();

      // Draw mascot inside frame
      pd.mascotFn(ctx, W/2, frameY + frameH/2 + 10, 130, pd.accent);

      // Deco words near mascot (skip if empty)
      if (pd.deco.length > 0) {
        ctx.font = '700 28px "Noto Sans TC", sans-serif'; ctx.fillStyle = pd.accent; ctx.textAlign = 'left';
        pd.deco.forEach((word, i) => {
          const dx = (i % 2 === 0) ? frameX + 16 : frameX + frameW - ctx.measureText(word).width - 16;
          ctx.fillText(word, dx, frameY + 24 + i * 180);
        });
      }

      // Small smiley next to mascot
      drawSmiley(frameX + frameW - 60, frameY + frameH - 60, 22, pd.accent);

      // --- Level title (huge) ---
      const titleY = frameY + frameH + 40;
      ctx.font = '900 96px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(pd.bigWordCN, W/2, titleY);

      // --- Ticker band ---
      const tickerY = titleY + 130;
      ctx.fillStyle = pd.accent;
      ctx.fillRect(0, tickerY, W, 52);
      ctx.font = '700 22px "Noto Sans TC", sans-serif';
      ctx.fillStyle = pd.bg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const tickStr = (pd.bigWord + '  ').repeat(20);
      ctx.fillText(tickStr, 0, tickerY + 26);

      // --- Tags section ---
      const tagsY = tickerY + 80;
      ctx.font = '700 34px "Noto Sans TC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';

      // Draw tags as scattered bold text
      const allTags = pd.tags;
      allTags.forEach((tag, i) => {
        const ty = tagsY + i * 56;
        // Tag pill bg
        const tw = ctx.measureText(tag).width;
        const px = (W - tw) / 2 - 20;
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath(); ctx.roundRect(px, ty - 4, tw + 40, 48, 24); ctx.fill();
        ctx.fillStyle = pd.accent;
        ctx.fillText(tag, W/2, ty);
      });

      // --- Traits as small text ---
      const traitsY = tagsY + allTags.length * 56 + 30;
      ctx.font = '500 28px "Noto Sans TC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      pd.traits.forEach((trait, i) => {
        ctx.fillText(trait, W/2, traitsY + i * 46);
      });

      // --- Bottom section ---
      // Score display
      const bottomY = H - 320;
      ctx.font = '900 96px "Noto Sans TC", sans-serif';
      ctx.fillStyle = pd.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(`${score} / ${questions.length}`, W/2, bottomY);
      ctx.font = '500 32px "Noto Sans TC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillText('答對題數', W/2, bottomY + 110);

      // Bottom ticker
      ctx.fillStyle = pd.accent;
      ctx.fillRect(0, H - 140, W, 48);
      ctx.font = '700 20px "Noto Sans TC", sans-serif';
      ctx.fillStyle = pd.bg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const btTicker = '  · 你也來測測看 · 周杰倫粉絲大調查 · @韭點開始 · JAY CHOU QUIZ · fromnineon ·';
      ctx.fillText(btTicker.repeat(2), 0, H - 116);

      // Brand
      ctx.font = '700 28px "Noto Sans TC", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('by @韭點開始 fromnineon', W/2, H - 76);

      // --- Export (show only, no auto-download) ---
      canvas.toBlob(blob => {
        if (!blob) { showToast('圖片生成失敗，請重試'); return; }
        window._lastShareBlob = blob;
        try {
          const url = URL.createObjectURL(blob);
          document.getElementById('shareImg').src = url;
        } catch(e) {
          // Fallback for in-app browsers that block blob URLs
          const reader = new FileReader();
          reader.onload = () => { document.getElementById('shareImg').src = reader.result; };
          reader.readAsDataURL(blob);
        }
      }, 'image/png');
    }

    function downloadShareImage() {
      const blob = window._lastShareBlob;
      if (!blob) return;
      // Try Web Share API (works on native Safari/Chrome)
      try {
        if (navigator.share && navigator.canShare) {
          const file = new File([blob], 'jay-quiz-result.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: '周杰倫粉絲大調查' }).catch(() => {});
            return;
          }
        }
      } catch(e) {}
      // Try <a download> (works in normal browsers, blocked in IG/LINE)
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'jay-quiz-result.png'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('圖片已下載！');
      } catch(e) {
        // In-app browser fallback: prompt long-press
        showToast('請長按上方圖片來儲存');
      }
    }

    function shareText() {
      const r = results.find(r => score >= r.min && score <= r.max);
      const text = `周杰倫粉絲大調查：我答對了 ${score}/${questions.length} 題！\n我的等級是「${r.title}」\n${r.subtitle}\n\n你也來測測 → ${window.location.href}\nby @韭點開始`;

      if (navigator.share) {
        navigator.share({ title: '周杰倫粉絲大調查', text: text }).catch(() => copyToClipboard(text));
      } else {
        copyToClipboard(text);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast('已複製到剪貼簿！'))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('已複製到剪貼簿！'); }
      catch(e) { showToast('複製失敗，請手動複製'); }
      document.body.removeChild(ta);
    }

    // ===== TEST: Jump to result =====
    function previewResult(fakeScore) {
      score = fakeScore;
      showResult();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
