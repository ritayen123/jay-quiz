  <!-- Boba pearls -->
  <circle cx="125" cy="260" r="10" fill="#2D1810"/>
  <circle cx="125" cy="262" r="3" fill="rgba(255,255,255,0.25)" transform="translate(2,-4)"/>

  <circle cx="150" cy="275" r="10" fill="#2D1810"/>
