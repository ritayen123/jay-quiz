  <circle cx="175" cy="260" r="10" fill="#2D1810"/>
  <circle cx="175" cy="262" r="3" fill="rgba(255,255,255,0.25)" transform="translate(2,-4)"/>

  <circle cx="137" cy="290" r="10" fill="#2D1810"/>
  <circle cx="137" cy="292" r="3" fill="rgba(255,255,255,0.25)" transform="translate(2,-4)"/>

  <circle cx="163" cy="290" r="10" fill="#2D1810"/>
  <circle cx="163" cy="292" r="3" fill="rgba(255,255,255,0.25)" transform="translate(2,-4)"/>

  <circle cx="185" cy="278" r="10" fill="#2D1810"/>
  <circle cx="185" cy="280" r="3" fill="rgba(255,255,255,0.25)" transform="translate(2,-4)"/>

  <circle cx="112" cy="280" r="10" fill="#2D1810"/>
